apiVersion: v1
kind: Service
metadata:
  name: tornado-service
spec:
  type: NodePort
  ports:
    - name: memory
      port: 8880
      targetPort: 8880
      nodePort: 30880
    - name: tornado
      port: 3011
      targetPort: 3011
      nodePort: 30881
  selector:
    app: tornado
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tornado
spec:
  selector:
    matchLabels:
      app: tornado
  replicas: 1
  template:
    metadata:
      labels:
        app: tornado
    spec:
      containers:
        - name: tornado
          image: 172.24.173.77:30500/tornado:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8880
            - containerPort: 3011
          env:
            - name: TZ
              value: 'Asia/Shanghai'
            - name: NODE_ENV
              value: 'production'
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: mysql_host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: mysql_port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: mysql_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: mysql_password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: mysql_database
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: openai_api_key
            - name: TORNADO_API_URL
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: tornado_api_url
            - name: TORNADO_MODEL
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: tornado_model
            - name: IMAGE_API_URL
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: image_api_url
            - name: IMAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: image_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: deepseek_api_key
            - name: DEEPSEEK_API_URL
              value: 'https://api.deepseek.com'
            - name: OPENAI_TRANSCRIPTION_MODEL
              value: 'qwen3.6-plus'
            - name: PROACTIVE_IDLE_MINUTES
              value: '10'
            - name: MEMORY_API
              value: 'http://localhost:8880'
            - name: PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: password_salt
            - name: DEFAULT_INVITE_CODE
              valueFrom:
                secretKeyRef:
                  name: tornado-secret
                  key: default_invite_code
---
